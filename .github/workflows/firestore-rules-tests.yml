name: Firestore Rules Tests

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'package.json'
      - 'tests/firestore-rules.test.cjs'
      - 'tests/pwa-config.test.cjs'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'assets/pwa-icon.svg'
      - '.github/workflows/firestore-rules-tests.yml'
  push:
    branches:
      - main
      - security/admin-custom-claim-gate

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run PWA installability configuration tests
        run: npm run test:pwa

      - name: Run Firestore Emulator rules tests
        run: npx firebase emulators:exec --only firestore --project mluna-fab51-rules-test "npm run test:firestore-rules"
